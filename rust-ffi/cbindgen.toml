language = "C"
pragma_once = true
include_guard = "ENCRE_FFI_H"
autogen_warning = "/* Warning: This file is auto-generated by cbindgen. Do not modify manually. */"
include_version = true
namespace = "encre"
tab_width = 4

[export]
prefix = "encre_"
item_types = ["globals", "enums", "structs", "unions", "typedefs", "opaque", "functions", "constants"]
# Exclude platform-specific extern declarations that conflict with system headers
exclude = [
    "CFRelease", "CFTypeRef", "CFStringRef", "AXUIElementRef", "AXError",
    "AXUIElementCreateSystemWide", "AXUIElementCopyAttributeValue",
    "CFStringCreateWithCString", "CFStringGetCStringPtr",
    "CGEventCreateKeyboardEvent", "CGEventSetFlags", "CGEventPost",
    "CGEventSetIntegerValueField", "CGEventSourceKeyState",
    "CGEventTapCreate", "CGEventTapEnable", "CGEventGetIntegerValueField", "CGEventGetFlags",
    "CFMachPortCreateRunLoopSource", "CFRunLoopGetCurrent", "CFRunLoopAddSource", "CFRunLoopRun",
    "kCFRunLoopCommonModes"
]

[parse]
parse_deps = false
include = ["encre-ffi"]

[fn]
rename_args = "None"
must_use = "Error"

[defines]
"target_os = linux" = "ENCRE_LINUX"
"target_os = macos" = "ENCRE_MACOS"
"target_os = windows" = "ENCRE_WINDOWS"
