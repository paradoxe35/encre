name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FYNE_CLI_VERSION: v1.7.2
  # ggml defaults to -march=native, which would tie a release to the runner:
  # pin an AVX2 baseline (x86 from ~2013), inert on arm64. The BLAS probe is
  # off because the cgo link never provides a BLAS on Linux or Windows.
  TRANSCRIBE_CMAKE_ARGS: >-
    -DGGML_NATIVE=OFF
    -DGGML_SSE42=ON
    -DGGML_AVX=ON
    -DGGML_AVX2=ON
    -DGGML_FMA=ON
    -DGGML_F16C=ON
    -DGGML_BMI2=ON
    -DTRANSCRIBE_USE_SYSTEM_BLAS=OFF
  LINUX_DEPS: >-
    build-essential cmake libasound2-dev libgl1-mesa-dev libwayland-dev xorg-dev
    libx11-dev libxkbfile-dev libxtst-dev libxdo-dev libxi-dev libpng-dev libjpeg-dev
    libxinerama-dev libxcb-xkb-dev libxcb-shape0-dev libxcb-xfixes0-dev
    libxkbcommon-x11-dev libxcursor-dev libxrandr-dev libxrender-dev libxfixes-dev
    libxxf86vm-dev libxkbcommon-dev

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-ffi

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_DEPS

      - name: Rust tests and lints
        working-directory: rust-ffi
        run: |
          cargo test --release
          cargo clippy --release

      - name: Build Rust FFI library
        run: |
          bash scripts/build-rust-ffi.sh
          mkdir -p lib && cp rust-ffi/target/release/libencre_ffi.a lib/

      # internal/input drives a real display and microphone; it is exercised by the release smoke test instead.
      - name: Go vet and tests
        run: |
          go vet ./...
          go test $(go list ./... | grep -v /internal/input)

  build:
    name: Build ${{ matrix.platform }}/${{ matrix.arch }}
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest Ubuntu runner still offered: the binary links the runner's
          # glibc and libstdc++, so this is what lets Ubuntu 22.04 and Debian 12 run it.
          - os: ubuntu-22.04
            platform: linux
            arch: amd64
            rust-target: x86_64-unknown-linux-gnu
          - os: windows-latest
            platform: windows
            arch: amd64
            rust-target: x86_64-pc-windows-gnu
          # Both macOS builds run on Apple silicon; the Intel one cross-compiles.
          - os: macos-latest
            platform: darwin
            arch: amd64
            rust-target: x86_64-apple-darwin
          - os: macos-latest
            platform: darwin
            arch: arm64
            rust-target: aarch64-apple-darwin

    defaults:
      run:
        shell: bash

    env:
      CGO_ENABLED: "1"
      GOOS: ${{ matrix.platform }}
      GOARCH: ${{ matrix.arch }}
      ARTIFACT: encre-${{ matrix.platform }}-${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-ffi
          key: ${{ matrix.rust-target }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_DEPS

      - name: Install Windows build dependencies
        if: matrix.platform == 'windows'
        run: choco install mingw nsis -y --no-progress

      - name: Install Fyne CLI
        env:
          GOOS: ""
          GOARCH: ""
        run: go install fyne.io/tools/cmd/fyne@${{ env.FYNE_CLI_VERSION }}

      - name: Build Rust FFI library
        run: |
          bash scripts/build-rust-ffi.sh ${{ matrix.rust-target }}
          mkdir -p lib && cp rust-ffi/target/${{ matrix.rust-target }}/release/libencre_ffi.a lib/

      - name: Embed Wit.ai keys
        env:
          WITAI_KEYS: ${{ secrets.WITAI_KEYS }}
        run: bash scripts/embed-witai-keys.sh

      - name: Resolve version
        id: version
        run: |
          # fyne wants x.y.z, so a manual run builds 0.0.0.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Package with Fyne
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # go build links any stale .syso over --icon.
          rm -f ./*.syso FyneApp.ico
          case "${{ matrix.platform }}" in
            darwin) ICON=assets/icon_1024.png; EXTRA="--app-id me.pngwasi.encre" ;;
            *)      ICON=assets/icon.png;      EXTRA="" ;;
          esac
          fyne package --icon "$ICON" --name Encre --release $EXTRA \
            --app-version "$VERSION" --app-build "$GITHUB_RUN_NUMBER"

      - name: Package for Linux
        if: matrix.platform == 'linux'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p pkg dist
          tar -xf Encre.tar.xz -C pkg
          BINARY=$(find pkg -path "*/usr/local/bin/*" -type f -perm -u+x | head -n 1)
          test -n "$BINARY" || { echo "no binary in Encre.tar.xz"; tar -tf Encre.tar.xz; exit 1; }
          mv "$BINARY" encre

          # Portable archive.
          mkdir -p portable && cp encre assets/icon.png portable/
          tar -czf "dist/$ARTIFACT.tar.gz" -C portable .

          # Debian package.
          mkdir -p deb/DEBIAN deb/usr/local/bin deb/usr/share/applications deb/usr/share/icons/hicolor/256x256/apps deb/usr/share/pixmaps
          install -m 755 encre deb/usr/local/bin/encre
          install -m 644 packaging/linux/me.pngwasi.encre.desktop deb/usr/share/applications/
          install -m 644 assets/icon.png deb/usr/share/icons/hicolor/256x256/apps/encre.png
          install -m 644 assets/icon.png deb/usr/share/pixmaps/encre.png
          sed -e "s/@VERSION@/$VERSION/" -e "s/@ARCH@/${{ matrix.arch }}/" packaging/linux/control > deb/DEBIAN/control
          dpkg-deb --build deb "dist/$ARTIFACT.deb"

          # AppImage.
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          install -m 755 encre AppDir/usr/bin/encre
          install -m 644 packaging/linux/me.pngwasi.encre.desktop AppDir/usr/share/applications/
          install -m 644 assets/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/encre.png
          ARCH=x86_64 ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage
          mv Encre-*.AppImage "dist/$ARTIFACT.AppImage"

      - name: Package for Windows
        if: matrix.platform == 'windows'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist portable
          mv Encre.exe encre.exe
          cp encre.exe assets/icon.ico portable/
          (cd portable && 7z a -bd "../dist/$ARTIFACT-portable.zip" .)
          export PATH="$PATH:/c/Program Files (x86)/NSIS"
          makensis \
            "/DPRODUCT_VERSION=$VERSION" \
            "/DSOURCE_EXE=$(cygpath -w "$PWD/encre.exe")" \
            "/DICON=$(cygpath -w "$PWD/assets/icon.ico")" \
            "/DOUTFILE=$(cygpath -w "$PWD/dist/$ARTIFACT-installer.exe")" \
            packaging/windows/installer.nsi
          cp encre.exe "dist/$ARTIFACT.exe"

      - name: Package for macOS
        if: matrix.platform == 'darwin'
        run: |
          mkdir -p dist
          test -d Encre.app || { echo "Encre.app was not created"; ls -la; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" Encre.app/Contents/Info.plist

          # Ad-hoc signed inside out, then stripped of quarantine, or the first launch reports a damaged app.
          EXEC=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" Encre.app/Contents/Info.plist)
          codesign --force --sign - "Encre.app/Contents/MacOS/$EXEC"
          codesign --force --sign - Encre.app
          codesign --verify --verbose=2 Encre.app
          xattr -cr Encre.app

          cp packaging/macos/INSTALL.txt .
          zip -r -X "dist/$ARTIFACT.zip" Encre.app INSTALL.txt

          brew install create-dmg
          create-dmg --volname Encre --window-size 600 400 --icon-size 100 \
            --icon Encre.app 175 120 --hide-extension Encre.app --app-drop-link 425 120 \
            --no-internet-enable "dist/$ARTIFACT.dmg" Encre.app

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: sha256sum * > checksums.txt

      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            Revise, translate and dictate text anywhere, with global hotkeys.

            ## Downloads

            - **Windows**: `encre-windows-amd64-installer.exe`, or `encre-windows-amd64-portable.zip`
            - **macOS**: `encre-darwin-arm64.dmg` (Apple silicon), `encre-darwin-amd64.dmg` (Intel)
            - **Linux**: `encre-linux-amd64.deb`, `encre-linux-amd64.AppImage`, or `encre-linux-amd64.tar.gz`

            Verify what you downloaded against `checksums.txt`.

            ## Setup

            Installation, hotkeys and troubleshooting are in the
            [README](https://github.com/paradoxe35/encre#installation). Two things
            that catch people out:

            - **macOS**: the first launch is blocked. Right-click the app, then Open.
              The ZIP ships `INSTALL.txt` with the alternatives.
            - **Linux on Wayland**: hotkeys need you in the `input` group:
              `sudo usermod -aG input $USER`, then log out and back in.
